<!doctype html><html lang="es"><head><meta charset="utf-8"><style>
@font-face{font-family:Bricolage;src:url('../../../fonts/BricolageGrotesque_24pt_Condensed-Bold.ttf');font-weight:800}@font-face{font-family:Bricolage;src:url('../../../fonts/BricolageGrotesque_24pt_Condensed-SemiBold.ttf');font-weight:600}@font-face{font-family:Bricolage;src:url('../../../fonts/BricolageGrotesque_24pt_Condensed-ExtraLight.ttf');font-weight:300}
:root{--paper:#F1E8D8;--ink:#1A1410;--accent:#D24322;--sand:#9D8B75;--paper2:#E6DCC6}*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--paper)}body{font-family:Bricolage,sans-serif}.scene{position:absolute;inset:0;padding:245px 180px 350px 90px;opacity:0;overflow:hidden}.paper{background:var(--paper);color:var(--ink)}.dark{background:var(--ink);color:var(--paper)}.brand{position:absolute;top:245px;left:90px;width:190px}.dark .brand{content:url('../../../assets/logo-dark.svg')}.counter{position:absolute;top:257px;right:180px;font:18px ui-monospace,monospace;letter-spacing:4px;color:var(--sand)}.content{position:absolute;left:90px;right:180px;top:500px;transform-origin:left center}.title{font-size:126px;line-height:.91;letter-spacing:-4px;font-weight:800;max-width:810px}.accent{color:var(--accent)}.note{font-size:40px;line-height:1.12;font-weight:300;color:#756757;margin-top:48px;max-width:735px}.dark .note{color:rgba(241,232,216,.68)}.progress{position:absolute;left:90px;right:180px;bottom:350px;height:5px;background:rgba(157,139,117,.22)}.progress span{display:block;height:100%;width:0;background:var(--accent)}.visual{position:absolute;left:90px;top:1010px;width:810px;height:430px}.mockup{top:930px;height:540px}.mockup img{position:absolute;left:-260px;top:-65px;width:1330px;height:700px;object-fit:contain;filter:drop-shadow(0 30px 34px rgba(0,0,0,.36))}.ui-card{padding:38px;border-radius:26px;background:var(--paper);color:var(--ink);box-shadow:0 30px 70px -38px rgba(0,0,0,.65)}.service-row,.brief-row{height:68px;border-bottom:2px solid #C8BBA4;display:flex;align-items:center;justify-content:space-between;font-size:28px;font-weight:600}.brief-row b{color:var(--accent)}.service-row{font-size:32px}.service-row span{font:18px ui-monospace,monospace;color:var(--sand)}
.faq-stack{top:970px;height:520px}.faq-bubble{position:absolute;width:650px;padding:25px 30px;border-radius:25px;background:var(--ink);color:var(--paper);font-size:32px;font-weight:600;box-shadow:0 24px 50px -30px rgba(0,0,0,.65)}.faq-bubble:nth-child(1){top:0;left:0}.faq-bubble:nth-child(2){top:125px;left:105px;background:var(--accent)}.faq-bubble:nth-child(3){top:250px;left:20px}.faq-bubble small{display:block;margin-top:8px;font-size:20px;font-weight:300;opacity:.7}.faq-dot{position:absolute;right:24px;top:24px;width:16px;height:16px;border-radius:50%;background:var(--accent)}.faq-bubble:nth-child(2) .faq-dot{background:var(--paper)}
.journey{top:990px;height:470px;display:flex;gap:18px;align-items:flex-end}.journey-step{position:relative;width:250px;height:250px;border:4px solid currentColor;border-radius:30px;padding:25px;display:flex;align-items:flex-end;font-size:39px;font-weight:800;overflow:hidden}.journey-step:nth-child(2){height:320px;background:var(--accent);border-color:var(--accent);color:var(--paper)}.journey-step:nth-child(3){height:390px;background:var(--ink);color:var(--paper)}.dark .journey-step:nth-child(3){background:var(--paper);color:var(--ink)}.journey-step b{position:absolute;top:18px;right:20px;font:22px ui-monospace,monospace;color:var(--sand)}.journey-line{position:absolute;left:0;bottom:0;height:8px;background:var(--accent)}
.conversion{top:970px;height:500px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.conversion-card{position:relative;border-radius:32px;padding:28px 24px;display:flex;flex-direction:column;justify-content:space-between;background:var(--ink);color:var(--paper);overflow:hidden}.conversion-card:nth-child(2){margin-top:55px;background:var(--accent)}.conversion-card:nth-child(3){margin-top:110px;background:var(--paper);color:var(--ink);border:4px solid var(--ink)}.conversion-card b{font-size:38px;line-height:.95}.conversion-card small{font:18px ui-monospace,monospace;letter-spacing:2px;color:var(--sand)}.conversion-card i{position:absolute;width:150px;height:150px;border:3px solid currentColor;border-radius:50%;right:-45px;top:-45px;opacity:.25}.conversion-pulse{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--paper);left:26px;top:26px}.conversion-card:nth-child(3) .conversion-pulse{background:var(--accent)}
.purpose{top:980px;height:490px}.purpose-window{position:absolute;inset:0;border:4px solid currentColor;border-radius:30px;overflow:hidden}.purpose-nav{height:62px;border-bottom:3px solid currentColor;padding:19px 25px;font:18px ui-monospace,monospace;color:var(--sand)}.purpose-grid{display:grid;grid-template-columns:1.15fr .85fr;height:calc(100% - 62px)}.purpose-copy{padding:55px 35px;font-size:56px;font-weight:800;line-height:.92}.purpose-copy span{color:var(--accent)}.purpose-panel{background:var(--ink);color:var(--paper);display:grid;place-items:center;text-align:center;font-size:29px;font-weight:600;padding:25px}.purpose-panel b{display:block;font-size:82px;color:var(--accent)}
.fake-feed{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.fake-feed i{height:270px;border-radius:18px;background:#D2C5AF;display:flex;align-items:flex-end;padding:22px;color:#756757;font:18px ui-monospace,monospace}.fake-feed i:nth-child(2){background:#C4B399}.fake-feed i:nth-child(3){background:#B5A184}.template-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.template-grid i{height:300px;border:3px solid currentColor;border-radius:16px;opacity:.18}.browser{top:940px;height:500px;border:10px solid currentColor;border-top-width:54px;border-radius:24px;overflow:hidden;background:var(--ink);box-shadow:0 34px 70px -38px rgba(0,0,0,.55)}.browser:before{content:'●  ●  ●';position:absolute;top:-43px;left:20px;color:var(--accent);font:18px ui-monospace,monospace;letter-spacing:8px;z-index:2}.browser video{width:100%;height:100%;object-fit:cover;object-position:top center}.scanline{position:absolute;left:0;right:0;top:0;height:8px;background:var(--accent);box-shadow:0 0 28px var(--accent)}.message-box{font-size:65px;font-weight:800;border-left:12px solid var(--accent);padding:28px 35px;background:rgba(210,67,34,.08)}.cta .content{top:610px;text-align:center}.cta .title{font-size:118px}.cta .note{margin:52px auto 0;max-width:690px}.button{display:inline-flex;margin-top:68px;padding:28px 50px;border-radius:999px;background:var(--accent);color:var(--paper);font-size:34px;font-weight:600}.url{margin-top:32px;font:22px ui-monospace,monospace;letter-spacing:4px;color:var(--sand)}
</style></head><body><main id="reel"></main><script>
const clamp=(v,min,max)=>Math.min(max,Math.max(min,v)),ease=v=>1-Math.pow(1-v,3);
const visual=s=>{if(s.visual==='mockup')return `<div class="visual mockup"><img src="${s.asset}"></div>`;if(s.visual==='video')return `<div class="visual browser"><video src="${s.asset}" muted loop autoplay playsinline></video><i class="scanline"></i></div>`;if(s.visual==='faq')return '<div class="visual faq-stack"><div class="faq-bubble">¿Qué incluye?<small>Alcance claro desde el inicio.</small><i class="faq-dot"></i></div><div class="faq-bubble">¿Cómo trabajamos?<small>Un proceso simple y acompañado.</small><i class="faq-dot"></i></div><div class="faq-bubble">¿Cómo empezamos?<small>Conociendo tu negocio.</small><i class="faq-dot"></i></div></div>';if(s.visual==='services')return '<div class="visual ui-card services"><div class="service-row">DISEÑO WEB<span>01</span></div><div class="service-row">DESARROLLO<span>02</span></div><div class="service-row">SEO Y PERFORMANCE<span>03</span></div></div>';if(s.visual==='path')return '<div class="visual journey"><div class="journey-step"><b>01</b>ENTENDER</div><div class="journey-step"><b>02</b>CONFIAR</div><div class="journey-step"><b>03</b>CONTACTAR</div><i class="journey-line"></i></div>';if(s.visual==='feed')return '<div class="visual fake-feed"><i>POST 01</i><i>POST 02</i><i>POST 03</i></div>';if(s.visual==='templates')return '<div class="visual template-grid"><i></i><i></i><i></i></div>';if(s.visual==='brief')return '<div class="visual ui-card brief"><div class="brief-row">NEGOCIO<b>✓</b></div><div class="brief-row">CLIENTES<b>✓</b></div><div class="brief-row">OBJETIVOS<b>✓</b></div></div>';if(s.visual==='purpose')return '<div class="visual purpose"><div class="purpose-window"><div class="purpose-nav">TU WEB / OBJETIVO</div><div class="purpose-grid"><div class="purpose-copy">NO ES ADORNO.<br><span>ES UNA HERRAMIENTA.</span></div><div class="purpose-panel"><div><b>→</b>GUIAR AL CONTACTO</div></div></div></div></div>';if(s.visual==='funnel')return '<div class="visual conversion"><div class="conversion-card"><i></i><span class="conversion-pulse"></span><small>01 / DESCUBRIR</small><b>REDES</b></div><div class="conversion-card"><i></i><span class="conversion-pulse"></span><small>02 / ENTENDER</small><b>TU WEB</b></div><div class="conversion-card"><i></i><span class="conversion-pulse"></span><small>03 / ACTUAR</small><b>CONTACTO</b></div></div>';if(s.visual==='message')return `<div class="visual message-box" data-text="${s.message}">${s.message}</div>`;return ''};
window.setReel=data=>{document.getElementById('reel').innerHTML=data.scenes.map((s,i)=>`<section class="scene ${s.dark?'dark':'paper'} ${s.cta?'cta':''}" data-start="${s.start}" data-end="${s.end}"><img class="brand" src="../../../assets/logo.svg"><span class="counter">${String(i+1).padStart(2,'0')} / ${String(data.scenes.length).padStart(2,'0')}</span><div class="content"><div class="title">${s.title}</div><div class="note">${s.note}</div>${s.cta?`<div class="button">${s.cta}</div><div class="url">${s.url}</div>`:''}</div>${visual(s)}<div class="progress"><span></span></div></section>`).join('');window.renderAt(0)};
window.renderAt=ms=>{const t=ms/1000;document.querySelectorAll('.scene').forEach(scene=>{const start=+scene.dataset.start,end=+scene.dataset.end,local=t-start,enter=clamp(local/.38,0,1),exit=end===18?1:clamp((end-t)/.25,0,1),visible=Math.min(enter,exit);scene.style.opacity=visible;scene.style.zIndex=t>=start&&t<end?'2':'1';scene.querySelector('.content').style.transform=`translateY(${(1-ease(enter))*75}px) scale(${.97+.03*ease(enter)})`;scene.querySelector('.progress span').style.width=`${clamp(local/(end-start),0,1)*100}%`;const mock=scene.querySelector('.mockup img');if(mock)mock.style.transform=`translateY(${(1-ease(enter))*70+Math.sin(local*2)*7}px) scale(${.92+.08*ease(enter)})`;const browser=scene.querySelector('.browser');if(browser)browser.style.transform=`translateY(${(1-ease(enter))*55}px) scale(${.95+.05*ease(enter)})`;const scan=scene.querySelector('.scanline');if(scan)scan.style.transform=`translateY(${clamp(local/3,0,1)*440}px)`;scene.querySelectorAll('.service-row,.brief-row').forEach((row,i)=>{const p=ease(clamp((local-.25-i*.15)/.45,0,1));row.style.transform=`translateX(${(1-p)*90}px)`;row.style.opacity=p});scene.querySelectorAll('.faq-bubble').forEach((bubble,i)=>{const p=ease(clamp((local-.18-i*.18)/.5,0,1));bubble.style.opacity=p;bubble.style.transform=`translate(${(1-p)*(i%2?90:-90)}px,${(1-p)*35}px) rotate(${(1-p)*(i%2?3:-3)}deg)`;const dot=bubble.querySelector('.faq-dot');dot.style.transform=`scale(${1+Math.sin((local-i*.15)*7)*.25})`});scene.querySelectorAll('.journey-step').forEach((step,i)=>{const p=ease(clamp((local-.15-i*.2)/.55,0,1));step.style.opacity=p;step.style.transform=`translateY(${(1-p)*110}px) scale(${.9+.1*p})`});const journeyLine=scene.querySelector('.journey-line');if(journeyLine)journeyLine.style.width=`${ease(clamp((local-.25)/1.6,0,1))*100}%`;scene.querySelectorAll('.conversion-card').forEach((card,i)=>{const p=ease(clamp((local-.1-i*.22)/.65,0,1));card.style.opacity=p;card.style.transform=`translateY(${(1-p)*140+Math.sin(local*3+i)*5}px) rotate(${(1-p)*(i-1)*5}deg)`;const pulse=card.querySelector('.conversion-pulse');pulse.style.transform=`scale(${1+Math.sin((local-i*.15)*8)*.45})`});const purpose=scene.querySelector('.purpose-window');if(purpose){const p=ease(clamp((local-.15)/.65,0,1));purpose.style.clipPath=`inset(0 ${100-p*100}% 0 0 round 30px)`;purpose.querySelector('.purpose-panel').style.transform=`translateX(${(1-ease(clamp((local-.75)/.55,0,1)))*180}px)`}scene.querySelectorAll('.fake-feed i').forEach((post,i)=>post.style.transform=`translateY(${((local*95+i*110)%520)-120}px) rotate(${(i-1)*2}deg)`);scene.querySelectorAll('.template-grid i').forEach((card,i)=>{const p=ease(clamp((local-.2-i*.15)/.5,0,1));card.style.transform=`translateY(${(1-p)*75}px) rotate(${(i-1)*3}deg)`;if(local>1.5)card.style.transform+=` translateX(${(i-1)*(local-1.5)*45}px)`});const message=scene.querySelector('.message-box');if(message){const chars=message.dataset.text;message.textContent=chars.slice(0,Math.floor(clamp((local-.35)/1.1,0,1)*chars.length))}const button=scene.querySelector('.button');if(button)button.style.transform=`scale(${1+Math.sin(local*4)*.025})`;});};
</script></body></html>
